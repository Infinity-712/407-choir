name: choir407
services:
  app:
    image: choir407:20261001
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: state/app.env
    ports: ['127.0.0.1:3001:3001']
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  proxy:
    image: choir407:frontend-20261003-r1
    user: '0'
    entrypoint: ['nginx']
    command: ['-g', 'daemon off;']
    network_mode: host
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./state/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./state/certs:/etc/letsencrypt:ro
      - ./state/acme:/var/www/acme:ro
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1/.well-known/acme-challenge/407-readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  turn:
    image: choir407:20261001
    user: '0'
    entrypoint: ['turnserver']
    command: ['-c', '/etc/turnserver.conf']
    network_mode: host
    restart: unless-stopped
    profiles: ['https']
    volumes:
      - ./state/turnserver.conf:/etc/turnserver.conf:ro
      - ./state/certs:/etc/letsencrypt:ro
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'node', '-e', "const s=require('node:tls').connect({host:'124.221.108.122',port:5349},()=>{s.end();process.exit(s.authorized?0:1)});s.on('error',()=>process.exit(1));s.setTimeout(4000,()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  certbot:
    image: choir407:20261001
    user: '0'
    entrypoint: ['/opt/acme/bin/certbot']
    network_mode: host
    profiles: ['tools']
    volumes:
      - ./state/certs:/etc/letsencrypt
      - ./state/acme:/var/www/acme
      - ./state/certbot-work:/var/lib/letsencrypt
      - ./state/certbot-log:/var/log/letsencrypt
    mem_limit: 256m
    logging: *logging
